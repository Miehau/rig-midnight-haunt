name: Deploy digest preview

on:
  workflow_dispatch:
    inputs:
      marker:
        description: Lane marker for review; leave empty to publish without a marker
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.16.1'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: pnpm test && pnpm typecheck
      - name: Export digest HTML
        env:
          LANE_MARKER: ${{ inputs.marker }}
        run: |
          mkdir -p "$RUNNER_TEMP/rig-preview"
          pnpm start > "$RUNNER_TEMP/rig-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8787/health > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/rig-server.log"
            exit 1
          fi
          curl --fail --silent --show-error http://localhost:8787/digest/2026-10-28 -o "$RUNNER_TEMP/rig-preview/index.html"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/rig-preview
          retention-days: 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
